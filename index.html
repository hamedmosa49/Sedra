<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sedra | سدرة</title>

    <link rel="stylesheet" href="Css/loading.css">
</head>

<body>

    <div class="loading-screen" id="loadingScreen">

        <!-- Golden glow -->
        <div class="gold-glow"></div>

        <!-- Welcome -->
        <div class="welcome">

            <span class="welcome-small">
                PREMIUM NATURAL PRODUCTS
            </span>

            <h1>
                أهلاً بكم في <span>سدرة</span>
            </h1>

            <h2>
                Welcome to <span>Sedra</span>
            </h2>

        </div>


        <!-- Honey Jar -->
        <div class="honey-container">

            <div class="jar">

                <div class="jar-lid"></div>

                <div class="jar-body">

                    <div class="honey">

                        <div class="honey-shine"></div>

                    </div>

                    <div class="jar-label">

                        <strong>سدرة</strong>

                        <small>SEDRA</small>

                        <span>طبيعي • فاخر • أصيل</span>

                    </div>

                </div>

            </div>


            <!-- Honey underneath -->
            <div class="honey-pool">

                <span class="drop drop1"></span>
                <span class="drop drop2"></span>
                <span class="drop drop3"></span>

            </div>

        </div>


        <!-- Loading -->
        <div class="loading-bottom">

            <div class="loading-text">
                جاري التحضير...
            </div>

            <div class="progress">

                <div class="progress-bar"></div>

            </div>

        </div>

    </div>


    <script src="Js/loading.js"></script>

</body>

</html>
